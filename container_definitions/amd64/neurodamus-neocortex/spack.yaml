spack:
  specs:
    - libnl
    - 'libevent@2:'  # external openmpi expects it to be there, spack doesn't add it
    - hwloc  # external openmpi expects it to be there, spack doesn't add it
    - neurodamus-models model=neocortex ~plasticity+coreneuron+caliper
    - py-neurodamus
  packages:
    neuron:
      require: "build_type=Debug"
    libfabric:
      require: fabrics=shm,efa,sockets,tcp,udp
    openmpi:
      require: fabrics=ofi,ucx
    all:
      providers:
        mpi: [openmpi]
