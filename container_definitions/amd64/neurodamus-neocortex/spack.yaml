spack:
  specs:
    - neurodamus-models model=neocortex ~plasticity+coreneuron+caliper
    - py-neurodamus
  packages:
    neuron:
      require: "build_type=Debug"
    libfabric:
      require: fabrics=shm,efa,sockets,tcp,udp
    openmpi:
     require: fabrics=ofi
    all:
      providers:
        mpi: [openmpi]
